[build]
  command = "npm run build"
  publish = "dist"
  # Only build & deploy on official Git Tag releases (e.g. v1.0.0). Normal branch commits are ignored.
  ignore = "(test -n \"$TAG\" || git describe --tags --exact-match > /dev/null 2>&1) && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"

# Production SPA Redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers for Production Compliance (UU PDP & ISO/IEC 27001)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Long-term Caching for Immutable Static Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
